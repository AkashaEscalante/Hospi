name: hospi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.9.0
  web: ^1.1.1
  webview_flutter: ^4.10.0 # <--- Agregado aquí para poder mostrar el mapa
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # <--- Agregado aquí para que Flutter reconozca tu mapa HTML
  assets:
    - assets/images/
    - assets/web/mapa_hotel.html